<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d">
  <title id="t">Terminal introducing Himanshu Singh</title>
  <desc id="d">An animated terminal. whoami prints Himanshu Singh, web developer, Dehradun, India. cat now.txt prints Sr. Designer and Developer at Abbot Technologies, working on React with WordPress, payment gateways and n8n automations. git status prints on branch main, ahead of yesterday.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1433"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="58" height="34" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;.03;.09;1" values="0;0;110;110"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="133" height="34" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;.17;.24;1" values="0;0;180;180"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="238" height="34" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;.36;.43;1" values="0;0;150;150"/></rect></clipPath>
  </defs>

  <rect width="1000" height="350" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="349" rx="14" fill="none" stroke="#3b3560"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="24" r="7" fill="#febc2e"/>
  <circle cx="76" cy="24" r="7" fill="#28c840"/>
  <text x="500" y="30" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#8b86a8">himanshu@dehradun: ~</text>

  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20">
    <text x="40" y="82" fill="#7ee787" clip-path="url(#c1)">$ <tspan fill="#f0edff">whoami</tspan></text>
    <text x="40" y="112" fill="#d2a8ff" opacity="0">Himanshu Singh · web developer · Dehradun, India<animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;.11;.11;1" values="0;0;1;1"/></text>

    <text x="40" y="157" fill="#7ee787" clip-path="url(#c2)">$ <tspan fill="#f0edff">cat now.txt</tspan></text>
    <text x="40" y="187" fill="#79c0ff" opacity="0">Sr. Designer and Developer @ Abbot Technologies<animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;.26;.26;1" values="0;0;1;1"/></text>
    <text x="40" y="217" fill="#79c0ff" opacity="0">React + WordPress, payment gateways, n8n automations<animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;.28;.28;1" values="0;0;1;1"/></text>

    <text x="40" y="262" fill="#7ee787" clip-path="url(#c3)">$ <tspan fill="#f0edff">git status</tspan></text>
    <text x="40" y="292" fill="#ffa8cd" opacity="0">On branch main. Your branch is ahead of yesterday.<animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;.45;.45;1" values="0;0;1;1"/></text>

    <text x="40" y="326" fill="#7ee787" opacity="0">$<animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;.5;.5;1" values="0;0;1;1"/></text>
  </g>
  <rect x="60" y="310" width="11" height="20" fill="#f0edff" opacity="0">
    <animate attributeName="opacity" dur="1s" begin="7s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.5" values="1;0"/>
  </rect>
</svg>
